name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: SwiftPM tests
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Validate package manifest
        run: swift package dump-package

      - name: Run tests
        run: swift test --parallel

  ios-build-and-docs:
    name: iOS build and DocC
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build for iOS
        run: >-
          xcodebuild build
          -scheme ArcBLEKit
          -destination 'generic/platform=iOS'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO

      - name: Build DocC documentation
        run: >-
          xcodebuild docbuild
          -scheme ArcBLEKit
          -destination 'generic/platform=iOS'
          -derivedDataPath .build/docc
          CODE_SIGNING_ALLOWED=NO
